project:
  type: website
  output-dir: _site
  resources:
    - assets/
  render:
    - "*.qmd"
    - "datasets/**/*.qmd"
    - "techniques/**/*.qmd"
    - "tutorials/**/*.qmd"
    - "projects/**/*.qmd"

website:
  title: "Neuroimaging Training"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: student.qmd
        text: Students
      - href: supervisor.qmd
        text: Supervisors
      - href: library.qmd
        text: Lesson library
    right:
      - href: https://github.com/Donggyurim/neuroimaging-training
        text: GitHub
        icon: github
  search:
    location: navbar
    type: overlay
  page-footer:
    left: "Donggyurim’s placement programme · Learn together. Build reproducible research."
    right:
      - href: sources-and-contributions.qmd
        text: Sources & contributions
  repo-url: https://github.com/Donggyurim/neuroimaging-training
  repo-actions: [edit, issue]

format:
  html:
    theme: cosmo
    css: assets/styles.css
    toc: true
    code-copy: true

execute:
  enabled: false
