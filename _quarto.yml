project:
  type: website
  output-dir: _site
  resources:
    - "/assets/**"
    - "/notebooks/*.ipynb"
    - "!/supervisor-app/**"
    - "!/node_modules/**"
  render:
    - "*.qmd"
    - "datasets/**/*.qmd"
    - "techniques/**/*.qmd"
    - "tutorials/**/*.qmd"
    - "projects/**/*.qmd"
    - "!notebooks/**"
    - "!templates/**"
    - "!supervisor-app/**"

website:
  title: "Neuroimaging Training"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: student.qmd
        text: Students
      - href: supervisor.qmd
        text: Supervisor
      - href: library.qmd
        text: Library
    right:
      - href: https://github.com/Donggyurim/neuroimaging-training
        text: GitHub
        icon: github
  search:
    location: navbar
    type: overlay
  page-footer:
    left: "Neuroimaging Training · Donggyurim"
    right:
      - href: sources-and-contributions.qmd
        text: About
  repo-url: https://github.com/Donggyurim/neuroimaging-training

format:
  html:
    theme: cosmo
    css: assets/styles.css
    toc: false
    include-after-body: _includes/details.html
    code-copy: true

execute:
  enabled: false
