project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "datasets/**/*.qmd"
    - "techniques/**/*.qmd"
    - "tutorials/**/*.qmd"
    - "projects/**/*.qmd"

website:
  title: "Donggyurim’s Neuroimaging Training"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: tutorials/index.qmd
        text: Tutorials
      - href: datasets/index.qmd
        text: Datasets
      - href: techniques/index.qmd
        text: Techniques
      - href: projects/index.qmd
        text: Student projects
    right:
      - href: https://github.com/Donggyurim/neuroimaging-training
        text: GitHub
  sidebar:
    style: docked
    contents:
      - section: Tutorials
        contents:
          - tutorials/index.qmd
          - tutorials/getting-started.qmd
          - tutorials/structural-mri-pathway.qmd
          - tutorials/brainlife-first-run.qmd
      - section: Datasets
        contents:
          - datasets/index.qmd
          - datasets/openneuro-t1w.qmd
      - section: Techniques
        contents:
          - techniques/index.qmd
          - techniques/fastsurfer-pilot.qmd
          - techniques/regional-volume-analysis.qmd
          - techniques/brain-visualisation.qmd
      - section: Student projects
        contents:
          - projects/index.qmd
          - projects/structural-mri-handover.qmd
      - sources-and-contributions.qmd
  repo-url: https://github.com/Donggyurim/neuroimaging-training
  repo-actions: [edit, issue]

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true

execute:
  enabled: false
