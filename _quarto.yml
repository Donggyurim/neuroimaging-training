project:
  type: website
  output-dir: _site
  resources:
    - assets/
    - notebooks/*.ipynb
  render:
    - "*.qmd"
    - "datasets/**/*.qmd"
    - "techniques/**/*.qmd"
    - "tutorials/**/*.qmd"
    - "projects/**/*.qmd"
    - "!notebooks/**"
    - "!templates/**"
    - "!supervisor.qmd"
    - "!tutorials/getting-started.qmd"
    - "!tutorials/brainlife-first-run.qmd"

website:
  title: "Neuroimaging Training"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: library.qmd
        text: Library
  search:
    location: navbar
    type: overlay
  page-footer:
    left: "Neuroimaging Training · OpenNeuro · Google Colab"
    right:
      - href: sources-and-contributions.qmd
        text: About

format:
  html:
    theme: cosmo
    css: assets/styles.css
    toc: false
    include-after-body: _includes/details.html
    code-copy: true

execute:
  enabled: false
