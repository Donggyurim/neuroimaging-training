name: Website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.27
      - name: Render website
        run: quarto render
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Check student and supervisor flows
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Validate public notebook without executing analysis
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/check-notebooks.py
      - name: Check local site links
        run: python3 scripts/check-site.py
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-site
          path: _site
          retention-days: 7
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy website
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
